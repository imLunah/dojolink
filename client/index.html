<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DojoLink</title>
    <meta name="description" content="Private studio management app. Staff check in ninjas, track belt progress, and run clubs. Parents follow their child's journey. Sign in required." />
    <link rel="canonical" href="https://www.dojolink.app/" />
    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
    <!-- An installed shortcut takes its icon from the manifest, not from the
         favicon, and it captures that icon once at install time. Chrome looks
         for manifest icons first, then apple-touch-icon, then the favicon, so
         without these three lines a home screen tile falls back to whatever
         the browser can scrape and iOS ignores an SVG favicon outright. An
         already-installed shortcut keeps its old art until it is removed and
         re-added; nothing here can refresh one in place. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
    <!-- use-credentials because a manifest is otherwise fetched with cookies
         omitted, which is the one request Vercel's preview protection cannot
         recognise. It answers that fetch with a redirect to vercel.com, CSP
         judges the final URL, and default-src 'self' blocks it. Sending the
         cookie means no redirect and nothing to block. Same origin in
         production, so it changes nothing there. Do NOT instead widen the
         policy with a manifest-src allowing vercel.com: that weakens the real
         site to quieten a console message that only exists on previews. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Nunito is NOT preloaded, on purpose. The tag was correct — right `as`,
         right type, crossorigin, same URL the stylesheet asks for — but a
         preload counts as used only if something consumes it within a few
         seconds of load, and nothing here paints text until React boots. On a
         cold deploy that crosses the line and Chrome warns on every load. The
         font is still found the moment the first glyph is laid out, and
         font-display: swap covers the gap. -->
    <meta property="og:site_name" content="DojoLink" />
    <meta property="og:title" content="DojoLink" />
    <meta property="og:description" content="Dojo management for staff and parents. Check-ins, belt progress, clubs, and a parent portal." />
    <meta property="og:image" content="https://www.dojolink.app/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DojoLink: dojo management for staff and parents." />
    <meta property="og:url" content="https://www.dojolink.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.dojolink.app/og-preview.jpg" />
    <script>try{if(localStorage.getItem('dj-theme')==='dark'&&location.pathname.indexOf('/parent')!==0)document.documentElement.classList.add('dark')}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
